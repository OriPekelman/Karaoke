# Per-project dev container template. Copy to your project root, edit as
# needed.
#
# Daily use is via the `gx-run` wrapper from your Mac:
#   gx-run python train.py        # runs in `dev` service in tmux on gx10
#   gx-run --shell                # interactive shell in the dev container
#   gx-run pytest                 # ditto, your test runner
#
# Direct on gx10:
#   docker compose run --rm dev python train.py
#   docker compose run --rm --service-ports dev bash
#
# Mounts:
#   .                  →  /workspace      (the project itself)
#   /srv/data/scratch  →  /scratch        (ephemeral big data, datasets)
#   /srv/data/models   →  /models  (ro)   (Ollama-managed model cache)
#   hf_cache           →  /root/.cache/huggingface  (named volume)

services:
  dev:
    image: gx10/dev-pytorch:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /srv/data/scratch:/scratch
      - /srv/data/models:/models:ro
      - hf_cache:/root/.cache/huggingface
    # Forward host-side secrets (GH_TOKEN, HF_TOKEN, …) into the container
    # so `gh`, `huggingface-cli`, etc. work non-interactively. `required:
    # false` lets the template work on machines without this file (e.g.
    # the Mac side, or a fresh box). All vars are optional from compose's
    # perspective — missing values just mean the respective tool stays
    # unauthenticated.
    env_file:
      - path: ${HOME}/gx10_config/secrets.env
        required: false
    environment:
      HF_HOME: "/root/.cache/huggingface"
      TRANSFORMERS_CACHE: "/root/.cache/huggingface/hub"
      PYTHONUNBUFFERED: "1"
      # Some libraries (e.g. transformers) want a writable /root for scratch.
      HOME: "/root"
    deploy:
      resources:
        reservations:
          devices:
            # CDI path — modern device interface, faster cold-start than
            # legacy `nvidia` runtime hooks. Spec generated by
            # `hosts/gx10/bootstrap/06-docker.sh` into /etc/cdi/nvidia.yaml.
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]
    # `command:` is the default when nothing's passed. Override with
    # `docker compose run --rm dev <command>` for one-off invocations.
    command: bash
    # Uncomment if your project exposes a Jupyter / tensorboard / API port:
    # ports:
    #   - "8888:8888"

volumes:
  hf_cache:
